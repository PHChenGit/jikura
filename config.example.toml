# Copy to ~/.config/jikura/config.toml (or use jikura --config PATH).
# Names under CONTAINERS must match exactly, without a leading slash.
# Missing containers or fields default to USER = "root", SHELL = "bash".

[settings]
# Optional GitLab registry API endpoint, reserved for fetching support.
# Example: https://gitlab.example.com/api/v4/projects/123/registry/repositories
GITLAB_IMAGE_API = ""

[CONTAINERS.my-container]
USER = "root"
SHELL = "bash"

[CONTAINERS."app.production"]
USER = "app"
SHELL = "/bin/sh"
